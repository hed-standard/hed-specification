name: Deploy Documentation

# The published site (see docs/source/release_guide.md):
#   /              the newest release tag made with the current tooling (v4.0.0 on); until then, main
#   /prerelease/   main, with the "Unreleased draft" banner and hed-specification-<version>.pdf
#   /releases/     the committed release PDFs and hed-specification-latest.pdf
# Pull requests build everything as a check and attach the prerelease PDF to the run; only a push
# to main, a published release or a manual run deploys.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # A release event checks out the tag by default; /prerelease/ and /releases/ come from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Configure Git for GitHub Pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Build the released site
        # The newest v* tag whose tree has scripts/do_spec_release.py, i.e. a specification release
        # made with the current tooling. A version test cannot be used: the repository also carries
        # the schema-era tags v7.0.5, v8.0.0 and v8.1.0, and the 3.x tags do not build with today's
        # toolchain. With no such tag yet, main is published at the root as before.
        run: |
          tag=""
          for t in $(git tag --list 'v*' --sort=-v:refname); do
            if git cat-file -e "$t:scripts/do_spec_release.py" 2>/dev/null; then tag="$t"; break; fi
          done
          if [ -n "$tag" ]; then
            echo "root: tag $tag"
            git worktree add "$RUNNER_TEMP/released" "$tag"
            sphinx-build -b html -d "$RUNNER_TEMP/doctrees-released" "$RUNNER_TEMP/released/docs/source" site
          else
            echo "root: main (no release tag with scripts/do_spec_release.py yet)"
            sphinx-build -b html -d "$RUNNER_TEMP/doctrees-released" docs/source site
          fi

      - name: Build the prerelease site from main
        run: sphinx-build -b html -t prerelease -d "$RUNNER_TEMP/doctrees-prerelease" docs/source site/prerelease

      - name: Build the prerelease PDF
        # Google Chrome is preinstalled on the ubuntu-latest runner image.
        run: |
          python scripts/build_pdf.py --prerelease --no-sandbox
          cp docs/_build/pdf/prerelease/hed-specification-*.pdf site/prerelease/

      - name: Add the released PDFs
        run: |
          python scripts/do_spec_release.py check
          cp -r releases site/releases

      - name: Attach the prerelease PDF to the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prerelease-pdf
          path: site/prerelease/*.pdf

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

  #------------------------------------------------
  # Deploy Job: Deploys the built site
  #------------------------------------------------
  deploy:
    # This job depends on the 'build' job completing successfully
    needs: build
    # Deploy on pushes to main, published releases and manual runs; never on pull requests
    if: github.event_name != 'pull_request' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    # Specify the deployment environment
    environment:
      name: github-pages
      # The URL will be automatically set by the deployment step's output
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        # This is the official action for deploying the artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
