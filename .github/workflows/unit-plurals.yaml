---
name: Unit plurals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-plurals:
    name: unit_plurals.json and the Appendix A.1.1 table agree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check the file and the generated table
        # The runner image provides python3; the script uses the standard library only.
        run: python3 scripts/generate_unit_plural_table.py --check
