---
name: Release PDFs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  releases:
    name: releases/ holds the release PDFs and a current latest copy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check the release PDFs
        # The runner image provides python3; the check uses the standard library only.
        run: python3 scripts/do_spec_release.py check
