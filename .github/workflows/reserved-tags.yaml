---
name: Reserved tags

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reserved-tags:
    name: reserved_tags.json and the section 3.2.8 tables agree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check the file and the generated tables
        # The script uses the standard library only.
        run: python3 scripts/generate_reserved_table.py --check
